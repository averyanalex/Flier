name: Build 🔨
on: 
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install required applications
        run: sudo apt-get install pandoc wkhtmltopdf -y --no-install-recommends

      - name: Build jar
        run: make jar

      - name: Build docs
        run: make docs

      - uses: actions/upload-artifact@v4
        name: Upload Jar
        with:
          name: flier-jar
          path: target/Flier.jar

      - uses: actions/upload-artifact@v4
        name: Upload Documentation
        with:
          name: flier-docs
          path: docs/Documentation.pdf
